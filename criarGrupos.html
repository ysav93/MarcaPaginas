<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Grupo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fff8e7;
            margin: 0;
            padding: 0;
        }
        /* Cabeçalho */
        
        #cabecalhoCadastro {
            margin: 100px 30px 30px;
        }
        
        #titulo {
            font-family: "Isometra", serif;
            color: #751020;
            margin: 0;
        }
        /* Formulário */
        
        #formulario {
            background-color: white;
            border: 2px solid #751020;
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 950px;
            margin: 0 auto 40px;
        }
        
        .form-label {
            color: #751020;
            margin-bottom: 8px;
        }
        
        .form-control {
            border: 1px solid #d9a3ae;
            border-radius: 8px;
            background-color: #fffdf9;
            padding: 10px;
        }
        
        .form-control:focus {
            border-color: #751020;
            box-shadow: 0 0 0 0.2rem rgba(117, 16, 32, 0.15);
        }
        /* Campo de PIN */
        
        #areaPin {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 25px;
            background-color: #fff0f1;
            border: 2px solid #eab4bf;
            border-radius: 12px;
        }
        
        #pinGerado {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        #iconeCadeado {
            color: #751020;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }
        
        #pin {
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 150px;
            min-height: 65px;
            padding: 10px 20px;
            border: 2px solid #f0c3cb;
            border-radius: 40px;
            background-color: #fff8f5;
            color: #751020;
            font-family: monospace;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 6px;
            margin: 0;
        }
        /* Botões */
        
        .botoes {
            min-width: 120px;
            height: 50px;
            padding: 5px 15px;
            border: 2px solid #751020;
            border-radius: 30px;
            background-color: #f8ccd7;
            color: #751020;
            font-family: "Isometra", serif;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .botoes:hover {
            background-color: #751020;
            color: white;
        }
        
        #botaoPin {
            min-width: 170px;
        }
        
        #botaoCadastrar {
            display: flex;
            justify-content: flex-end;
            margin-top: 30px;
        }
        /* Responsividade */
        
        @media (max-width: 600px) {
            #cabecalhoCadastro {
                margin: 90px 15px 25px;
            }
            #formulario {
                width: calc(100% - 30px);
                padding: 20px 15px;
                margin-bottom: 25px;
            }
            #titulo {
                font-size: 22px;
            }
            #areaPin {
                flex-direction: column;
                align-items: stretch;
                gap: 20px;
                padding: 15px;
            }
            #pinGerado {
                justify-content: center;
                gap: 12px;
            }
            #pin {
                min-width: 130px;
                min-height: 55px;
                font-size: 23px;
            }
            #botaoPin {
                width: 100%;
            }
            #botaoCadastrar .botoes {
                width: 100%;
            }
            .botoes {
                height: 45px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- Cabeçalho -->

    <div id="cabecalhoCadastro">
        <h3 id="titulo">Criar Grupo</h3>
    </div>

    <!-- Formulário -->

    <form id="formulario" onsubmit="cadastrar(event)">

        <div class="mb-4">
            <label for="nomeGrupo" class="form-label">
                Nome do grupo:
            </label>

            <input type="text" class="form-control" id="nomeGrupo" name="nomeGrupo" placeholder="Digite o nome do grupo" required>
        </div>

        <div class="mb-4">
            <label for="urlImagem" class="form-label">
                URL da imagem do grupo:
            </label>

            <input type="url" class="form-control" id="urlImagem" name="urlImagem" placeholder="https://exemplo.com/imagem.jpg" required>
        </div>

        <div class="mb-4">
            <label for="descricao" class="form-label">
                Breve descrição:
            </label>

            <input type="text" class="form-control" id="descricao" name="descricao" placeholder="Digite uma descrição para o grupo" required>
        </div>

        <!-- PIN do grupo -->

        <div class="mb-3">

            <label class="form-label" for="pin">
                Pin do grupo:
            </label>

            <div id="areaPin">

                <div id="pinGerado">

                    <svg id="iconeCadeado" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

                        

                    </svg>

                    <p id="pin" aria-live="polite">----</p>

                </div>

                <button type="button" class="botoes" id="botaoPin" onclick="gerarPin()">

                    Gerar Pin

                </button>

            </div>

        </div>

        <!-- Botão Criar -->

        <div id="botaoCadastrar">

            <button type="submit" class="botoes">
                Criar
            </button>

        </div>

    </form>

    <script>
        function gerarPin() {
            let pin = Math.floor(Math.random() * 10000);

            document.getElementById("pin").textContent =
                String(pin).padStart(4, "0");
        }

        function cadastrar(event) {
            event.preventDefault();

            const pin = document.getElementById("pin").textContent;

            if (pin === "----") {
                alert("Gere um PIN antes de criar o grupo.");
                return;
            }

            alert("Grupo preenchido com sucesso! PIN: " + pin);

            // Aqui você pode adicionar a lógica
            // para salvar o grupo no banco de dados.
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
