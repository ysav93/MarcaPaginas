<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tela de Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fff8e7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        
        #quadrado {
            background-color: white;
            border: 2px solid #99182a;
            border-radius: 15px;
            padding: 30px;
            width: 350px;
            max-width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        #entrar {
            background-color: #99182a;
            border-color: #99182a;
            width: 100%;
        }
        
        #entrar:hover {
            background-color: #751020;
            border-color: #751020;
        }
        
        #titulo {
            font-family: "Isometra", serif;
            color: #751020;
        }
    </style>
</head>

<body>



    <div id="quadrado">
        <h3 class="text-center mb-4" id="titulo">MarcaPáginas</h3>

        <form>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu email" required>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn btn-primary" id="entrar" onclick="entrar()">
                Entrar
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        function entrar() {
            window.location.href = "telaInicio.html";
        }
    </script>

</body>

</html>
