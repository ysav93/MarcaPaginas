<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #F3DDC8;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #inicio {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }
        
        #inicio img {
            width: 180px;
            border-radius: 50%;
        }
        
        #inicio h1 {
            color: #7c0116;
            font-size: 28px;
            margin-bottom: -10px;
        }
        
        #inicio p {
            color: #7c0116;
            font-size: 16px;
        }
        
        .botoes {
            width: 180px;
            padding: 12px;
            background-color: #7c0116;
            color: white;
            border: 2px solid #e0a4b0;
            border-radius: 25px;
            font-size: 15px;
            transition: 0.3s;
        }
    </style>

</head>

<body>

    <div id="inicio">

        <img src="logo.jpg" alt="Logo">

        <h1>Minha Biblioteca</h1>

        <p>Comece sua jornada literária!</p>

        <button type="button" class="botoes" onclick="login()">
        Entrar
    </button>

    </div>

    <script>
        function login() {
            window.location.href = "telaLogin.html";
        }
    </script>


</body>

</html>
