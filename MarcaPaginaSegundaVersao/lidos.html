<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lidos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Isometra&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fff8e7;
            margin: 0;
            padding: 0;
        }
        
        #contorno {
            background-color: #f8ccd7;
        }
        
        #nome {
            font-family: "Isometra", serif;
            color: #751020;
        }
        
        .navbar {
            padding: 0;
        }
        
        .navbar .container-fluid {
            padding: 10px 20px;
        }
        
        #titulo {
            font-family: "Isometra", serif;
            color: #751020;
            margin: 0;
        }
        
        .botoes {
            width: 105px;
            height: 50px;
            border: 2px solid #751020;
            border-radius: 30px;
            background-color: #f8ccd7;
            color: #751020;
            font-family: "Isometra", serif;
            cursor: pointer;
        }
        
        .botoes:hover {
            background-color: #751020;
            color: white;
        }
        /* Título e botões na mesma linha */
        
        #cabecalhoLidos {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin: 100px 30px 25px;
        }
        
        .grupoBotoes {
            display: flex;
            gap: 10px;
        }
        /* Livro */
        
        #lidos {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin: 0 30px;
        }
        
        .imagemLivro {
            width: 130px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        #detalhesLivro p {
            margin-bottom: 12px;
        }
        /* Avaliação abaixo dos detalhes do livro */
        
        #avaliacao {
            text-align: left;
            margin-top: 15px;
        }
        
        .estrelas {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 5px;
        }
        
        .estrelas input {
            display: none;
        }
        
        .estrelas label {
            font-size: 40px;
            color: #ccc;
            cursor: pointer;
        }
        /* Cor das estrelas selecionadas */
        
        .estrelas input:checked~label {
            color: #ffc107;
        }
        /* Cor das estrelas ao passar o mouse */
        
        .estrelas label:hover,
        .estrelas label:hover~label {
            color: #ffc107;
        }
        /* Botão Atualizar */
        
        #botaoAtualizar {
            display: flex;
            justify-content: flex-end;
            margin: 20px 30px;
        }
        /* Responsividade */
        
        @media (max-width: 500px) {
            #cabecalhoLidos {
                margin: 90px 15px 25px;
                gap: 10px;
            }
            .grupoBotoes {
                gap: 5px;
            }
            .botoes {
                width: auto;
                height: 42px;
                padding: 5px 10px;
                font-size: 12px;
            }
            #lidos {
                margin: 0 15px;
                gap: 12px;
            }
            .imagemLivro {
                width: 100px;
                height: 150px;
            }
            #detalhesLivro p {
                font-size: 14px;
                margin-bottom: 10px;
            }
            .estrelas {
                gap: 2px;
            }
            .estrelas label {
                font-size: 32px;
            }
            #botaoAtualizar {
                margin: 20px 15px;
            }
        }
        /* Barra de pesquisa */
        
        #barraPesquisa {
            background-color: #fff8e7;
            padding: 20px 30px;
            margin-top: 65px;
        }
        /* Formulário */
        
        #barraPesquisa form {
            max-width: 600px;
            margin: 0 auto;
            gap: 10px;
        }
        /* Campo de pesquisa */
        
        #barraPesquisa .form-control {
            border: 2px solid #f8ccd7;
            border-radius: 25px;
            background-color: white;
            color: #751020;
            padding: 12px 18px;
            box-shadow: none;
        }
        /* Texto do campo */
        
        #barraPesquisa .form-control::placeholder {
            color: #9b737b;
        }
        /* Efeito ao clicar no campo */
        
        #barraPesquisa .form-control:focus {
            border-color: #751020;
            box-shadow: 0 0 5px #f8ccd7;
        }
        /* Botão de pesquisa */
        
        .botaoPesquisa {
            background-color: #f8ccd7;
            color: #751020;
            border: 2px solid #751020;
            border-radius: 25px;
            padding: 10px 20px;
            cursor: pointer;
            white-space: nowrap;
            font-family: "Isometra", serif;
        }
        /* Efeito ao passar o mouse */
        
        .botaoPesquisa:hover {
            background-color: #751020;
            color: white;
        }
        /* Ajustes para celular */
        
        @media (max-width: 500px) {
            #barraPesquisa {
                padding: 15px;
            }
            #barraPesquisa form {
                gap: 8px;
            }
            .botaoPesquisa {
                padding: 8px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top" id="contorno">
        <div class="container-fluid">

            <a class="navbar-brand" href="#" id="nome">MarcaPaginas</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="telaInicio.html">Início</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Comunidades</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Grupos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="minhaBiblioteca.html">Minha biblioteca</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>
    <nav id="barraPesquisa">
        <div class="container-fluid">
            <form class="d-flex" role="search">
                <input class="form-control" type="search" placeholder="Pesquisar livros..." aria-label="Pesquisar livros">

                <button class="botaoPesquisa" type="submit">
                Pesquisar
            </button>
            </form>
        </div>
    </nav>

    <!-- Título e botões -->

    <div id="cabecalhoLidos">

        <h3 id="titulo">Lidos</h3>

        <div class="grupoBotoes">
            <button type="button" class="botoes" onclick="queroLer()">Quero ler</button>
            <button type="button" class="botoes" onclick="lendo()">Lendo</button>
            <button type="button" class="botoes" onclick="cadastrar()">Cadastrar Livro</button>
        </div>

    </div>

    <!-- Informações do livro -->

    <div id="lidos">

        <img src="livro.jpg" class="imagemLivro" alt="Capa do livro">

        <div id="detalhesLivro">

            <p><strong>Título:</strong></p>
            <p><strong>Autor:</strong></p>
            <p><strong>Número de páginas:</strong></p>

            <!-- Avaliação com estrelas -->

            <div id="avaliacao">

                <div class="estrelas">

                    <input type="radio" id="estrela5" name="avaliacao" value="5">
                    <label for="estrela5">&#9733;</label>

                    <input type="radio" id="estrela4" name="avaliacao" value="4">
                    <label for="estrela4">&#9733;</label>

                    <input type="radio" id="estrela3" name="avaliacao" value="3">
                    <label for="estrela3">&#9733;</label>

                    <input type="radio" id="estrela2" name="avaliacao" value="2">
                    <label for="estrela2">&#9733;</label>

                    <input type="radio" id="estrela1" name="avaliacao" value="1">
                    <label for="estrela1">&#9733;</label>

                </div>

            </div>

        </div>

    </div>

    <!-- Botão Atualizar -->

    <div id="botaoAtualizar">
        <button type="button" class="botoes" onclick="atualizar()">Atualizar</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        function queroLer() {
            window.location.href = "queroLer.html";
        }

        function lendo() {
            window.location.href = "minhaBiblioteca.html";
        }

        function cadastrar() {
            window.location.href = "cadastrarLivro.html";
        }

        function atualizar() {
            window.location.href = "atualizar.html";
        }
    </script>

</body>

</html>
